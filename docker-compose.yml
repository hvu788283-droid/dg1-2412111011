services:
  web:
    build: .
    environment:
      - MSSV=2412111011
      - PORT=5000
    volumes:
      - ./app/data:/app/data
    expose:
      - "5000"

  nginx:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web